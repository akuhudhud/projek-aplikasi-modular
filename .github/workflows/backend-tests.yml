
name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, dom, xml, curl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

      - name: Diagnose registration completion test
        run: >-
          vendor/bin/phpunit
          --configuration phpunit.xml
          --filter 'RegistrationFlowTest::test_registration_completion_creates_active_user_and_session'

      - name: Run full feature test suite
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Run MySQL concurrency regression test
        run: vendor/bin/phpunit --configuration phpunit.mysql.xml

      - name: Verify runner ratings migration rollback
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DB_CONNECTION" != "mysql" ||
                "$DB_DATABASE" != "laravel_testing" ||
                "$APP_ENV" != "testing" ]]; then
            echo "::error::Refusing rollback outside the isolated CI test database."
            exit 1
          fi

          create_migration="database/migrations/2026_10_29_000001_create_runner_task_ratings_table.php"

          if [[ ! -f "$create_migration" ]]; then
            echo "::error::Ratings table migration not found: $create_migration"
            exit 1
          fi

          echo "Preparing isolated CI database..."
          php artisan migrate:fresh --force

          echo "Checking ratings table and CHECK constraint..."

          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          if (! Illuminate\Support\Facades\Schema::hasTable("runner_task_ratings")) {
              fwrite(STDERR, "FAIL: runner_task_ratings does not exist.\n");
              exit(1);
          }

          $constraintCount = Illuminate\Support\Facades\DB::table("information_schema.TABLE_CONSTRAINTS")
              ->where("CONSTRAINT_SCHEMA", Illuminate\Support\Facades\DB::getDatabaseName())
              ->where("TABLE_NAME", "runner_task_ratings")
              ->where("CONSTRAINT_NAME", "runner_task_ratings_rating_range_check")
              ->where("CONSTRAINT_TYPE", "CHECK")
              ->count();

          if ($constraintCount !== 1) {
              fwrite(STDERR, "FAIL: rating CHECK constraint is missing.\n");
              exit(1);
          }

          echo "PASS: ratings table and CHECK constraint exist.\n";
          '

          echo "Rolling back the ratings table migration..."

          php artisan migrate:rollback \
            --path="$create_migration" \
            --force

          echo "Verifying ratings table and CHECK constraint were removed..."

          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          if (Illuminate\Support\Facades\Schema::hasTable("runner_task_ratings")) {
              fwrite(STDERR, "FAIL: runner_task_ratings still exists after rollback.\n");
              exit(1);
          }

          $constraintCount = Illuminate\Support\Facades\DB::table("information_schema.TABLE_CONSTRAINTS")
              ->where("CONSTRAINT_SCHEMA", Illuminate\Support\Facades\DB::getDatabaseName())
              ->where("TABLE_NAME", "runner_task_ratings")
              ->where("CONSTRAINT_NAME", "runner_task_ratings_rating_range_check")
              ->where("CONSTRAINT_TYPE", "CHECK")
              ->count();

          if ($constraintCount !== 0) {
              fwrite(STDERR, "FAIL: rating CHECK constraint still exists.\n");
              exit(1);
          }

          echo "PASS: ratings table and CHECK constraint removed.\n";
          '

          echo "PASS: runner ratings migration rollback verified."
