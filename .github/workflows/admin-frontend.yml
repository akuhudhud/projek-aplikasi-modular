
name: Admin Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/admin/**"
      - ".github/workflows/admin-frontend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/admin/**"
      - ".github/workflows/admin-frontend.yml"

  workflow_dispatch:

concurrency:
  group: admin-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-frontend:
    name: Admin Frontend Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project files
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -d src

      - name: Install dependencies
        run: npm install

      - name: TypeScript verification
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Production build
        run: npm run build
